services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://tyac:${POSTGRES_PASSWORD}@db:5432/tyac
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tyac
      POSTGRES_USER: tyac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tyac_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyac -d tyac"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  tyac_pgdata:
